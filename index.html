<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: grid;
      grid-template-columns: 320px 360px 50px;
      grid-template-rows: 414px 296px 20px;
      gap: 9px;
      background-color: #000;
      width: 748px;
    }

    .item1 {
      background-color: #E72F24;
    }

    .item2 {
      background-color: #F0F1EC;
      grid-column: span 2;
    }

    .item3 {
      background-color: #F0F1EC;
    }

    .item4 {
      background-color: #F0F1EC;
    }

    .item5 {
      background-color: #004592;
      height: 130px;
      grid-column: 3 / 4;
      grid-row: 2 / 3;
    }

    .item6 {
      background-color: #F0F1EC;
      grid-column: 3 / 4;
      grid-row: 2 / 3;
      height: 185px;
      margin-top: 130px;
      border-top: 10px solid #000;
    }

    .item7 {
      background-color: #F0F1EC;
    }

    .item8 {
      background-color: #F9D01E;
      width: 198px;
      grid-column: 2 / 3;
      grid-row: 3 / 4;
    }

    .item9 {
      background-color: #232629;
      grid-column: 2 / 3;
      grid-row: 3 / 4;
      margin-left: 207px;
    }

  </style>
</head>

<body>
   <div class="container">
    <div class="item1"></div>
    <div class="item2"></div>
    <div class="item3"></div>
    <div class="item4"></div>
    <div class="item5"></div>
    <div class="item6"></div>
    <div class="item7"></div>
    <div class="item8"></div>
    <div class="item9"></div>
   </div>
</body>

</html>
